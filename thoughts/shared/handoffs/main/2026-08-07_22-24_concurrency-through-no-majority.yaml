decisions:
  - rate_limit_keys_on_host: "Six nvidia-* backends share one endpoint and one quota. LimiterRegistry keys on urlparse(base_url).netloc, at the LOWEST rpm any backend on that host declares, and only ever tightens so registration order cannot matter."
  - sleep_inside_the_limiter_lock: "Deliberate. Releasing first lets every waiting thread read the same _last and fire together — that IS the 503 storm. Only admission is serialized; the HTTP call runs outside the lock."
  - none_not_a_sentinel: "VoteResult/FlipStats use None for no-majority so a consumer that ignores it gets AttributeError, not a plausible wrong number. This is how agreement_matrix and contention_ranking were found — both crashed on real data the moment the type changed."
  - exclude_unsettled_but_count_it: "kappa/accuracy/false_approve_rate exclude unsettled-verdict pairs; reason_confusion excludes unsettled-reason pairs. false_approve_rate is the sharpest case — it is a SAFETY metric, so a coin flip recorded as an approve corrupts the number governing deployment risk."
  - coverage_deliberately_unchanged: "Coverage stays on judged pairs, not scored pairs. Basing it on the new n would drop it below 1.0 for one contested pair and the leaderboard's partial-coverage gate would silently remove that model from the ranking — worse than the bug."
  - usage_is_observation_not_config: "Token usage is NOT part of already_judged_ids identity, so capturing it invalidates no existing result file and forces no re-judging."
  - absent_is_not_zero: "A host reporting no usage leaves usage=None and increments calls_unmeasured; sums stay null. A total summed over 2 of 600 calls is worse than no total because it looks like one."

findings:
  - resume_breaks_file_order_without_concurrency: "A failed vote is retried on the NEXT launch and appends at the end of the file. Measured across S1: deepseek 47 pairs out of run_index order, inkling 33, the other six clean. So the order-dependence bug was already live in committed data; concurrency only widens it."
  - scenario_report_was_nondeterministic: "Two runs of identical code over identical data produced 60 differing lines. Cross-tab rows sorted on count alone, ties fell back to dict insertion order from iterating a SET, and Python randomizes str hashing per process. Confirmed by pinning PYTHONHASHSEED. THIS UNDERCUT 'regenerate and diff', the verification used for #10 and #12 — those conclusions hold only because the real differences dwarfed the noise and the diffs were read line by line, not because the method was sound."
  - fabricated_tie_breaks_ordered_human_review: "contention_ranking scored pairs partly on the tie-broken value, so a coin flip decided which pairs an operator saw FIRST. Not a wrong cell — wrong prioritisation of human review."
  - usage_makes_15_detectable: "cached_tokens is the in-band tell for a caching host collapsing majority-of-3 to n=1. That failure IMPROVES every metric while measuring nothing. #24 converts #15 from a known risk into a detectable one — but a cache hit alone is not a collapse (prompt-prefix caching is normal); the signal is cache hits AND a flat flip rate."
  - repo_is_already_public: "AGENTS.md said 'may go public'; agent-gh repo view returns PUBLIC. That stale wording is why real pair ids reached tests AND four public artifacts. Corrected in AGENTS.md, scope extended to issue bodies, PR descriptions and commit messages."
  - no_ground_truth_exists_yet: "data/ holds only README.md. score.py cannot run and kappa is uncomputable until Stephen's 200-row ruling pass happens. scenario_report.py is the only S1 artifact, and results/ is gitignored so it is never committable."

worked:
  - "Cannot write a failing test for a concurrency bug → use a REAL clock plus a threading.Barrier. The limiter red read '6 calls released within 0.002s of each other' — the 503 storm reproduced as a unit test."
  - "Suspect a test is a formality → mutation-check it. Forcing max_workers=1 failed exactly the two parallelism tests; reverting the tiebreaker failed 8/8 seeds. This habit caught three separate weak tests."
  - "New test might pass by luck → size the fixture against the odds. Four tied rows let one hash seed in five pass against broken code (~1 in 24); eight rows makes it 1 in 40320."
  - "Report diff shows changes after a refactor → check whether the tool is deterministic BEFORE blaming the change. Two runs of untouched code differed; PYTHONHASHSEED=0 made them identical, converting a suspicion into a controlled experiment."
  - "Claim about API response shape → look it up via context7 rather than guessing. /chat/completions and /messages differ more than expected (prompt_tokens vs input_tokens, and Anthropic sends NO total); wrong names would have silently recorded nulls that read as an unsupportive host."
  - "Verifying a claim about code at another ref → git show <ref>:<path> or git grep <pattern> <ref>. Never check out; the lead checked out main in the shared tree while a feature branch was live."

