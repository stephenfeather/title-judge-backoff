# Candidate judge backends.
#
# API keys are read from the environment variable named by api_key_env —
# NEVER put keys in this file. Backends whose key is absent are skipped at
# run time (see `uv run run_bakeoff.py --check-backends`).
#
# Fields:
#   api          "openai" (OpenAI-compatible chat completions) or "anthropic"
#   eval_only    true = terms permit evaluation/testing only, never production
#   role         "contender" = eligible to win; "floor" = baseline reference only
#   rpm          client-side rate limit
#   temperature  OPTIONAL. Omit unless the endpoint is PROVEN to accept a value:
#                an absent key means the field is never sent, and the verdict
#                records temperature=null rather than claiming 0.0. The GPT-5.x
#                family 400s on any explicit temperature unless reasoning effort
#                is "none" (probed 2026-08-06, both chat/completions and
#                responses), and Anthropic has deprecated the knob on recent
#                models. Determinism here comes from --votes, not this field.
#   reasoning_effort  OPTIONAL. none|low|medium|high|xhigh|max. Not a free knob:
#                on a borderline pair gpt-5.6-luna returned reason=truncation_worse
#                at effort "none" (0 reasoning tokens) and casing_error at
#                "medium" (~120), and score.py scores per-reason confusion.
#                Pin it where it matters; it is recorded on every verdict.
#   structured_output  OPTIONAL. Strict json_schema enum for the verdict. Not
#                every OpenAI-compatible endpoint implements strict mode, so it
#                is opt-in per backend rather than on by default.

# ---------------------------------------------------------------------------
# NVIDIA build.nvidia.com — free tier, EVALUATION ONLY per ToS.
# One NVIDIA_API_KEY covers every model on this endpoint.
#
# temperature = 0.0 is declared on these because this endpoint is PROVEN to
# accept it — the llama-3.1-8b floor completed a 5/5 smoke run at temperature 0.
# Keeping the value also keeps existing results/ resumable, since the run-config
# guard treats an omitted temperature as a different config from 0.0.
# ---------------------------------------------------------------------------

[[backends]]
name = "nvidia-deepseek-v4-flash"
base_url = "https://integrate.api.nvidia.com/v1"
model_id = "deepseek-ai/deepseek-v4-flash"
rpm = 40
eval_only = true
role = "contender"
api_key_env = "NVIDIA_API_KEY"
temperature = 0.0

[[backends]]
name = "nvidia-deepseek-v4-pro"
base_url = "https://integrate.api.nvidia.com/v1"
model_id = "deepseek-ai/deepseek-v4-pro"
rpm = 40
eval_only = true
role = "contender"
api_key_env = "NVIDIA_API_KEY"
temperature = 0.0

# NOTE (2026-08-05): advertised by GET /v1/models and on the public model page,
# but chat/completions returns 404 with:
#   "Function '23d4f03a-...': Not found for account '<account>'"
# That is an ACCOUNT ENTITLEMENT gap, not a wrong call shape — the NIM function
# behind this model is not provisioned for our account. Re-request shape changes
# nothing; the model needs enabling for the account (some NIMs require explicit
# access/terms acceptance). Left in place so a later --ping re-tests it; treat
# its results as absent until a ping reports [reachable].
#
# nvidia/llama-3.1-nemotron-ultra-253b-v1 fails the same way — catalog listing
# does NOT imply the account can invoke it. Ping every new id before trusting it.
[[backends]]
name = "nvidia-kimi-k2.6"
base_url = "https://integrate.api.nvidia.com/v1"
model_id = "moonshotai/kimi-k2.6"
rpm = 40
eval_only = true
role = "contender"
api_key_env = "NVIDIA_API_KEY"
temperature = 0.0

[[backends]]
name = "nvidia-nemotron-3-ultra"
base_url = "https://integrate.api.nvidia.com/v1"
model_id = "nvidia/nemotron-3-ultra-550b-a55b"
rpm = 40
eval_only = true
role = "contender"
api_key_env = "NVIDIA_API_KEY"
temperature = 0.0

# NOTE (2026-08-05): in the catalog and routed to a worker (no 404), but
# inference itself fails — HTTP 500 after ~79s:
#   {"type":"urn:nvcf-worker-service:problem-details:internal-server-error",
#    "title":"Internal Server Error","status":500,
#    "detail":"Internal error while making inference request"}
# A THIRD failure mode, distinct from Kimi's 404 entitlement gap: entitled and
# routed, but the backing worker errors. Likely transient/capacity — re-ping
# periodically. Its 79s latency is why REQUEST_TIMEOUT_S is 180s, not 60s.
[[backends]]
name = "nvidia-inkling"
base_url = "https://integrate.api.nvidia.com/v1"
model_id = "thinkingmachines/inkling"
rpm = 40
eval_only = true
role = "contender"
api_key_env = "NVIDIA_API_KEY"
temperature = 0.0

# Degenerate-judge floor: proved kappa catches a constant-reject predictor
# (5/5 rejects, accuracy 0.800, kappa 0.000 on the smoke set). Not a contender.
[[backends]]
name = "nvidia-llama31-8b-floor"
base_url = "https://integrate.api.nvidia.com/v1"
model_id = "meta/llama-3.1-8b-instruct"
rpm = 40
eval_only = true
role = "floor"
api_key_env = "NVIDIA_API_KEY"
temperature = 0.0

# ---------------------------------------------------------------------------
# Paid provider APIs. Each is skipped unless its key is present in the env.
#
# None of these declare a temperature. They ran at temperature 0 under the old
# harness-wide constant, but that is not the same as having PROVEN the endpoint
# accepts it today — Gemini, xAI, and Anthropic have each shipped models that
# reject or ignore the field. Omitting it is the safe default; re-declare
# `temperature = 0.0` on any backend once a --ping confirms it is accepted.
# ---------------------------------------------------------------------------

[[backends]]
name = "gemini-2.5-pro"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model_id = "gemini-2.5-pro"
rpm = 60
eval_only = false
role = "contender"
api_key_env = "GEMINI_API_KEY"

[[backends]]
name = "xai-grok-4.1-fast"
base_url = "https://api.x.ai/v1"
model_id = "grok-4.1-fast"
rpm = 60
eval_only = false
role = "contender"
api_key_env = "XAI_API_KEY"

[[backends]]
name = "anthropic-haiku-4.5"
base_url = "https://api.anthropic.com/v1"
model_id = "claude-haiku-4-5"
rpm = 50
eval_only = false
role = "contender"
api = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

# Probed 2026-08-06 on gpt-5.6-luna: temperature=0 returns 400 at reasoning
# effort medium on BOTH chat/completions and responses, and 200 at effort
# "none". We do NOT buy determinism by setting effort="none" — that disables
# the reasoning this model is worth using for, and on a borderline pair it
# changed the reason code (truncation_worse at "none" vs casing_error at
# "medium"). So: no temperature, no effort override, and stability comes from
# --votes instead. Verdicts from this backend record temperature=null.
[[backends]]
name = "openai-gpt-5.6-luna"
base_url = "https://api.openai.com/v1"
model_id = "gpt-5.6-luna"
rpm = 60
eval_only = false
role = "contender"
api_key_env = "OPENAI_API_KEY"
