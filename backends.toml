# Candidate judge backends.
#
# API keys are read from the environment variable named by api_key_env —
# NEVER put keys in this file. Backends whose key is absent are skipped at
# run time (see `uv run run_bakeoff.py --check-backends`).
#
# Fields:
#   api        "openai" (OpenAI-compatible chat completions) or "anthropic"
#   eval_only  true = terms permit evaluation/testing only, never production
#   role       "contender" = eligible to win; "floor" = baseline reference only
#   rpm        client-side rate limit

# ---------------------------------------------------------------------------
# NVIDIA build.nvidia.com — free tier, EVALUATION ONLY per ToS.
# One NVIDIA_API_KEY covers every model on this endpoint.
# ---------------------------------------------------------------------------

[[backends]]
name = "nvidia-deepseek-v4-flash"
base_url = "https://integrate.api.nvidia.com/v1"
model_id = "deepseek-ai/deepseek-v4-flash"
rpm = 40
eval_only = true
role = "contender"
api_key_env = "NVIDIA_API_KEY"

[[backends]]
name = "nvidia-deepseek-v4-pro"
base_url = "https://integrate.api.nvidia.com/v1"
model_id = "deepseek-ai/deepseek-v4-pro"
rpm = 40
eval_only = true
role = "contender"
api_key_env = "NVIDIA_API_KEY"

# NOTE (2026-08-05): this id is exactly what GET /v1/models advertises, but a
# chat/completions request against it returns 404 — listed in the catalog, not
# servable on this endpoint. Left in place so a later --ping re-tests it; treat
# its results as absent until a ping reports [reachable].
[[backends]]
name = "nvidia-kimi-k2.6"
base_url = "https://integrate.api.nvidia.com/v1"
model_id = "moonshotai/kimi-k2.6"
rpm = 40
eval_only = true
role = "contender"
api_key_env = "NVIDIA_API_KEY"

# Degenerate-judge floor: proved kappa catches a constant-reject predictor
# (5/5 rejects, accuracy 0.800, kappa 0.000 on the smoke set). Not a contender.
[[backends]]
name = "nvidia-llama31-8b-floor"
base_url = "https://integrate.api.nvidia.com/v1"
model_id = "meta/llama-3.1-8b-instruct"
rpm = 40
eval_only = true
role = "floor"
api_key_env = "NVIDIA_API_KEY"

